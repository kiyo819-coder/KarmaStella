// ── 節入り日を取得（テーブルにない年は概算フォールバック）──
const SETSU_DEFAULT = [0,6,4,6,5,6,6,8,8,8,9,8,8];
function getSetsuiri(year, month) {
  const tbl = SETSUIRI[year] || SETSU_DEFAULT;
  return tbl[month];
}

// ── 本命星（修正版 v2.1）──
function calcHonmeiSei(year, month, day) {
  const risshun = getSetsuiri(year, 2);
  const y = (month === 1 || (month === 2 && day < risshun)) ? year - 1 : year;
  let sum = String(y).split('').reduce((s, d) => s + parseInt(d,10), 0);
  while (sum > 9) sum = String(sum).split('').reduce((s, d) => s + parseInt(d,10), 0);
  let sei = 11 - sum;
  if (sei > 9) sei -= 9;
  if (sei <= 0) sei += 9;
  return sei;
}

const ZODIAC_BOUNDARIES = [
  {name:'牡羊座',symbol:'♈',start:[3,21],end:[4,19]},
  {name:'牡牛座',symbol:'♉',start:[4,20],end:[5,20]},

  {name:'山羊座',symbol:'♑',start:[12,22],end:[1,19]},
  {name:'水瓶座',symbol:'♒',start:[1,20],end:[2,18]},
  {name:'魚座',  symbol:'♓',start:[2,19],end:[3,20]},
];
function getZodiac(month, day) {
  for (const z of ZODIAC_BOUNDARIES) {
    const [sm,sd]=z.start, [em,ed]=z.end;
    if (sm > em) {
      if ((month===sm&&day>=sd)||(month===em&&day<=ed)||(month>sm)||(month<em)) return z;
    } else {
      if ((month===sm&&day>=sd)||(month===em&&day<=ed)||(month>sm&&month<em)) return z;
    }
  }
  return ZODIAC_BOUNDARIES[0];
}

  const y=$('by'),m=$('bm'),d=$('bd');
  for(let i=2025;i>=1940;i--){const o=document.createElement('option');o.value=i;o.textContent=i+'年';y.appendChild(o)}

  for(let i=1;i<=31;i++){const o=document.createElement('option');o.value=i;o.textContent=i+'日';d.appendChild(o)}

})();
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

  try{
    const u=new URLSearchParams(location.search);
    const k=u.get('license_key')||store('ks_lkey');
    if(k)$('lkey').value=k;
    const b=store('ks_bdate');
    if(b){const[yy,mm,dd]=b.split('-');$('by').value=yy;$('bm').value=mm;$('bd').value=dd}

function showErr(msg){const e=$('err');e.textContent=msg;e.style.display='block'}
async function view(){
  $('err').style.display='none';
  const key=$('lkey').value.trim();
  if(!key){showErr('ライセンスキーを入力してください。');return}
  const y=parseInt($('by').value,10),m=parseInt($('bm').value,10),d=parseInt($('bd').value,10);
  const sei=calcHonmeiSei(y,m,d);
  const zod=getZodiac(m,d);
  const type=sei+'-'+zod.name;
  const btn=$('btn-view');btn.disabled=true;btn.textContent='照合しています…';
  try{
    const r=await fetch(VERIFY_ENDPOINT,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({license_key:key,type})
    });
    const data=await r.json().catch(()=>({}));
    if(!r.ok||!data.ok){
      const msg=data.error==='license_revoked'
        ?'このキーは返金等により無効になっています。お心当たりがない場合はお問い合わせください。'
        :'キーを確認できませんでした。購入メールのキーをそのままコピーして貼り付けてください。';
      showErr(msg);return;
    }
    store('ks_lkey',key);store('ks_bdate',y+'-'+m+'-'+d);
    const t=data.texts||{};
    const req=['essence_deep','shadow_practice','love','work_mission','year_flow'];
    if(req.some(k2=>!t[k2])){showErr('レポートの生成に不備がありました。お手数ですがお問い合わせください。');return}
    $('r-emoji').textContent=(KYUUSEI_MIN[sei]||{}).emoji||'✦';
    $('r-type').textContent=(KYUUSEI_MIN[sei]||{}).name+' × '+zod.name+' '+zod.symbol;
    $('s-essence').textContent=t.essence_deep;
    $('s-shadow').textContent=t.shadow_practice;
    $('s-love').textContent=t.love;
    $('s-work').textContent=t.work_mission;
    $('s-year').textContent=t.year_flow;
    $('gate').style.display='none';
    $('report').style.display='block';
  }catch(e){
    showErr('通信に失敗しました。時間をおいてもう一度お試しください。');
  }finally{
    btn.disabled=false;btn.textContent='✦ 鑑定レポートを表示する ✦';
  }
}
